services:
  villa-db:
    image: mysql:8.0
    container_name: villa-db
    ports:
      - "${DB_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-villa_management}
      MYSQL_USER: ${DB_USERNAME:-villa_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-villa_password}
    volumes:
      - villa_mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    networks:
      - villa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  villa-redis:
    image: redis:7-alpine
    container_name: villa-redis
    ports:
      - "${REDIS_PORT:-16379}:6379"
    volumes:
      - villa_redis_data:/data
    networks:
      - villa-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  villa-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: villa-backend
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      villa-db:
        condition: service_healthy
      villa-redis:
        condition: service_healthy
    environment:
      - NODE_ENV=development
      - DB_HOST=villa-db
      - DB_PORT=3306
      - DB_DATABASE=villa_management
      - DB_USERNAME=villa_user
      - DB_PASSWORD=villa_password
      - REDIS_HOST=villa-redis
      - REDIS_PORT=6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
    networks:
      - villa-network

  villa-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: villa-frontend
    ports:
      - "${APP_PORT:-10080}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - villa-backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    networks:
      - villa-network

networks:
  villa-network:
    driver: bridge

volumes:
  villa_mysql_data:
  villa_redis_data:
